version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: udyam_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: udyam
      POSTGRES_PASSWORD: udyam_secret
      POSTGRES_DB: udyam_digital
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U udyam -d udyam_digital"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
